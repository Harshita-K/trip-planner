# Local development stack: Postgres (RDS stand-in), Redis (ElastiCache stand-in),
# Kafka in KRaft mode (MSK stand-in) and Kafka UI for inspecting topics.
#
#   docker compose up -d                 # infra only; run the app from your IDE or ./mvnw
#   docker compose --profile app up -d   # infra + the backend container

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wanderly
      POSTGRES_USER: wanderly
      POSTGRES_PASSWORD: wanderly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wanderly"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # S3-compatible object store for the analytics data lake (AWS S3 stand-in). S3 API on :8333.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    # Local-only S3 credentials (dev/dev) in infra/seaweedfs/s3.json; AWS SDK and DuckDB sign requests with them.
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0"
    ports:
      - "8333:8333"
    volumes:
      - lake:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Catches every email the app sends. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  backend:
    profiles: ["app"]
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wanderly
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:19092
      MAIL_HOST: mailpit
      LAKE_ENDPOINT: http://seaweedfs:8333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  pgdata:
  lake:
